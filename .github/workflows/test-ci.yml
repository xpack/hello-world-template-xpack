# https://help.github.com/en/actions
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# https://github.com/actions

# https://github.com/micro-os-plus/hello-world-qemu-template-xpack/actions/workflows/ci.yml
name: CI on Push

on:
  push:
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
    paths-ignore:
      - ".vscode/**"
      - "LICENSE"
      - "**.md"
      - ".clang-format"
      - ".gitignore"
      - ".npmignore"
      - ".github/workflows/test-all.yml"
      - ".github/FUNDING.yml"
      - "tests/scripts/**"
      - "README.md"
      - "README-MAINTAINER.md"
      - "README-DEVELOPER.md"
    # This should disable running the workflow on tags, according to the
    # on.<push|pull_request>.<branches|tags> GitHub Actions docs.
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushbranchestagsbranches-ignoretags-ignore
    branches:
      - "*"

jobs:
  ci-test:
    name: "CI hello-world-template tests"

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners
        # os: [ ubuntu-24.04, macos-13, macos-14, windows-2022 ]
        os:
          [
            "ubuntu-24.04",
            "ubuntu-24.04-arm",
            "macos-15-intel",
            "macos-15",
            "windows-2025",
          ]
        node-version: [20, 22]

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 3

      - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v6.0.1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show environment
        run: |
          uname -a
          node --version
          npm --version
          env

      - name: Satisfy project dependencies
        run: npm install

      - name: Run test-ci
        run: npm run test-ci
